<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsever93 Monitoring Dashboard</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .status-ok { color: #3fb950; }
        .status-warn { color: #f85149; font-weight: bold; }
        .data-val { font-size: 24px; color: #58a6ff; }
        h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>🛰️ Obsever93 Dashboard</h1>
    <div class="card">
        <p>ระดับการป้องกัน: <strong>สูงสุด (High-Level)</strong></p>
        <p>สถานะพยาน: <strong>Protected Witness</strong></p>
    </div>

    <div id="log-display">
        <div class="card">
            <h3>📊 ผลการสแกนล่าสุด</h3>
            <p id="time">รอข้อมูล...</p>
            <p>การแอบส่งข้อมูล: <span id="leak" class="data-val">0.00</span> KB</p>
            <p>สถานะ: <span id="status">กำลังตรวจสอบ...</span></p>
        </div>
    </div>

    <script>
        async function updateStats() {
            try {
                // ดึงข้อมูลจาก Firebase ของหัวหน้า
                const response = await fetch('https://สังเกตแอป-default-rtdb.firebaseio.com/obsever_logs.json');
                const data = await response.json();
                
                // นำค่าล่าสุดมาโชว์
                const lastId = Object.keys(data).pop();
                const lastLog = data[lastId];

                document.getElementById('time').innerText = "เวลาสแกน: " + lastLog.timestamp;
                document.getElementById('leak').innerText = lastLog.data_leak_kb || 0;
                document.getElementById('status').innerText = lastLog.status;
                document.getElementById('status').className = lastLog.status.includes('Normal') ? 'status-ok' : 'status-warn';
            } catch (e) {
                console.log("Error fetching data");
            }
        }
        setInterval(updateStats, 5000); // อัปเดตทุก 5 วินาที
        updateStats();
    </script>
</body>
</html>
